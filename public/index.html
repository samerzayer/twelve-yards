<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Twelve Yards</title>
<meta name="description" content="1v1 penalty shootout. Send a link, pick your corner, read your rival.">
<meta property="og:title" content="Twelve Yards — penalty shootout">
<meta property="og:description" content="I challenge you to a penalty shootout. Tap to play.">
<meta property="og:image" content="/game/cover.jpg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#04070e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;1,700;1,800;1,900&family=Big+Shoulders+Display:wght@700;900&family=Barlow:wght@400;600;700&display=swap">
<style>
/* Layout: full-bleed AI-rendered night stadium canvas; broadcast HUD floats over it. Single deliberate dark look. */
:root{
  --night:#04070e;
  --ink:#f4f1e8;
  --muted:#9aa3b5;
  --led:#ff7a1a;
  --you:#2f6bff;
  --rival:#e23d4b;
  --panel:rgba(6,10,20,.78);
  --line:rgba(255,255,255,.14);
  --good:#3ddc84;
  --bad:#ff5a5f;
  --gold:#ffd34d;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'Barlow',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font-size:14px}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.app{position:relative;height:100%;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.hud{position:absolute;inset:0;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
.hud > *{pointer-events:auto}

.top{display:flex;justify-content:center;align-items:flex-start;gap:10px}
.board{background:linear-gradient(180deg,rgba(14,20,36,.92),rgba(6,10,20,.92));border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 10px 34px rgba(0,0,0,.55)}
.bhead{display:flex;justify-content:space-between;gap:12px;padding:5px 12px;font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.2em;color:var(--muted);border-bottom:1px solid var(--line)}
.bhead b{color:var(--led);font-weight:900}
.rows{display:grid;gap:4px;padding:6px 12px 7px}
.row{display:grid;grid-template-columns:4px 56px 1fr 30px;align-items:center;gap:8px}
.chip{width:4px;height:18px;border-radius:2px}
.row.you .chip{background:var(--you)} .row.rival .chip{background:var(--rival)}
.row b{font-family:var(--display);font-weight:900;font-size:17px;letter-spacing:.08em}
.dots{display:flex;gap:5px}
.dot{width:15px;height:15px;border-radius:50%;border:1.5px solid rgba(255,255,255,.28);display:grid;place-items:center;font-size:9px;line-height:1;font-weight:700}
.dot.goal{background:var(--good);border-color:var(--good);color:#06240f}
.dot.miss{background:rgba(255,90,95,.15);border-color:var(--bad);color:var(--bad)}
.dot.next{border-color:var(--led);box-shadow:0 0 0 3px rgba(255,122,26,.28)}
.sc{font-family:var(--display);font-weight:900;font-style:normal;font-size:26px;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.icon-btn{width:40px;height:40px;border-radius:50%;background:var(--panel);border:1px solid var(--line);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn:focus-visible,.btn:focus-visible,.seg button:focus-visible{outline:2px solid var(--led);outline-offset:2px}
.icon-btn svg{width:18px;height:18px}

.prompt{margin:10px auto 0;text-align:center;width:fit-content;max-width:100%}
.role{font-family:var(--display);font-weight:900;font-size:clamp(24px,4.6vw,36px);letter-spacing:.06em;line-height:1;text-shadow:0 2px 16px rgba(0,0,0,.85)}
.role .tag{color:var(--led)}
.hint{font-size:14px;color:var(--ink);opacity:.9;margin-top:4px;text-shadow:0 1px 8px rgba(0,0,0,.95)}
.tbar{height:4px;background:rgba(255,255,255,.18);border-radius:2px;margin:8px auto 0;width:170px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--led);width:100%;transform-origin:left}

.read{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px 9px;width:min(290px,calc(100% - 32px));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.port .read{left:50%;transform:translateX(-50%)}
.land .read{left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.read h3{margin:0 0 6px;font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.16em;color:var(--muted);display:flex;justify-content:space-between}
.read h3 span{color:var(--ink);letter-spacing:.06em}
.bars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bar{display:grid;gap:3px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar .tr{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--muted);border-radius:3px;transition:width .4s}
.bar.hot .tr i{background:var(--led)}
.bar.hot{color:var(--ink)}
.read .empty{font-size:12px;color:var(--muted)}

.meter{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(460px,calc(100% - 32px));display:grid;gap:8px}
.meter .lbl{display:flex;justify-content:center;font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.16em;color:var(--ink);text-shadow:0 1px 6px #000}
.meter .lbl span:last-child{color:var(--led)}
.track{position:relative;height:14px;border-radius:7px;background:linear-gradient(90deg,#7a1b22,#ff5a5f 6%,#ff7a1a 22%,#ffd34d 38%,#3ddc84 47%,#3ddc84 53%,#ffd34d 62%,#ff7a1a 78%,#ff5a5f 94%,#7a1b22);box-shadow:inset 0 0 0 1px rgba(0,0,0,.45),0 6px 22px rgba(0,0,0,.6)}
.safe{position:absolute;top:-4px;bottom:-4px;border:2px solid #fff;border-radius:8px;box-shadow:0 0 12px rgba(255,255,255,.6);background:rgba(255,255,255,.08)}
.perfect{position:absolute;top:2px;bottom:2px;left:44%;width:12%;border-radius:6px;background:rgba(255,211,77,.35);box-shadow:inset 0 0 0 1px rgba(255,211,77,.9)}
.needle{position:absolute;top:-8px;bottom:-8px;width:4px;margin-left:-2px;background:#fff;border-radius:2px;box-shadow:0 0 12px #fff}
.btn{appearance:none;border:0;cursor:pointer;font-family:var(--display);font-weight:900;letter-spacing:.12em;font-size:20px;padding:13px 26px;border-radius:12px;background:var(--led);color:#1a0b00;box-shadow:0 10px 28px rgba(255,122,26,.35)}
.btn.ghost{background:rgba(255,255,255,.04);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.55;cursor:progress}

.call{position:absolute;left:0;right:0;text-align:center;pointer-events:none;transform:translateY(-50%)}
.call .big{font-family:var(--display);font-weight:900;font-size:clamp(58px,14vw,132px);letter-spacing:.02em;line-height:.88;text-transform:uppercase;color:var(--ink);text-shadow:0 6px 34px rgba(0,0,0,.75)}
.call.good .big{color:var(--led);text-shadow:0 0 34px rgba(255,122,26,.6),0 6px 30px rgba(0,0,0,.7)}
.call .sub{font-weight:700;font-size:17px;margin-top:6px;text-shadow:0 1px 10px rgba(0,0,0,1)}
.call.show .big{animation:pop .55s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(.35);opacity:0}to{transform:scale(1);opacity:1}}

.screen{position:absolute;inset:0;display:grid;place-items:center;overflow-y:auto;background:linear-gradient(180deg,rgba(4,7,14,.25) 0%,rgba(4,7,14,.78) 50%,rgba(4,7,14,.94) 100%);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
.card{width:min(460px,100%);text-align:center;display:grid;gap:14px;justify-items:center}
.eyebrow{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.3em;color:var(--led)}
.title{font-family:var(--display);font-weight:900;font-size:clamp(66px,17vw,128px);line-height:.82;letter-spacing:.01em;margin:0;text-wrap:balance;text-shadow:0 8px 44px rgba(0,0,0,.8)}
.title small{display:block;font-size:.36em;letter-spacing:.24em;color:var(--muted);margin-top:10px}
.how{list-style:none;padding:0;margin:2px 0 4px;display:grid;gap:8px;text-align:left;width:100%}
.how li{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:baseline;font-size:15px;line-height:1.35}
.how li b{font-family:var(--display);font-weight:900;letter-spacing:.12em;color:var(--led);font-size:15px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;padding:4px;width:100%}
.seg button{appearance:none;border:0;background:transparent;color:var(--muted);font-family:var(--display);font-weight:900;font-size:15px;letter-spacing:.12em;padding:9px 4px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:#0a0d16}
.diffnote{font-size:13px;color:var(--muted);min-height:18px}
.record{font-family:var(--display);font-weight:700;letter-spacing:.14em;font-size:13px;color:var(--muted)}
.final{font-family:var(--display);font-weight:900;font-size:clamp(76px,20vw,144px);line-height:.85;font-variant-numeric:tabular-nums}
.final span{color:var(--muted);font-weight:700}
.seq{display:grid;gap:6px}
.seq .dots{justify-content:center;flex-wrap:wrap}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.copied{font-size:13px;color:var(--good);min-height:18px}
.sharebox{width:100%;font:12px/1.4 ui-monospace,monospace;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:8px;padding:8px;color:var(--ink);white-space:pre;overflow-x:auto;text-align:left;-webkit-user-select:text;user-select:text;box-sizing:border-box}
.lgrid{display:grid;gap:12px;width:100%;justify-items:center}
.fld{display:grid;gap:6px;width:100%;text-align:left}
.fld span{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.2em;color:var(--muted)}
.fld input,.joinrow input{font:600 17px var(--body);color:var(--ink);background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:10px;padding:12px 14px;outline:none;width:100%;box-sizing:border-box;-webkit-user-select:text;user-select:text}
.fld input:focus,.joinrow input:focus{border-color:var(--led)}
.joinrow{display:grid;grid-template-columns:1fr auto;gap:8px;width:100%}
.joinrow input{text-transform:uppercase;letter-spacing:.3em;font-family:var(--display);font-weight:900}
.games{display:grid;gap:8px;width:100%}
.game{display:flex;justify-content:space-between;align-items:center;gap:10px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px;padding:8px 8px 8px 14px;text-align:left}
.game span{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.game small{display:block;color:var(--muted);font-weight:400}
.game .btn{font-size:16px;padding:9px 16px}
.code{font-family:var(--display);font-weight:900;font-size:64px;letter-spacing:.25em;color:var(--led);line-height:1;padding-left:.25em}
.lobbymsg{font-size:14px;color:var(--muted);min-height:20px;max-width:40ch}
.lobbymsg.err{color:var(--bad)}
.linkbox{width:100%;box-sizing:border-box;font:600 15px/1.4 ui-monospace,monospace;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:10px;padding:12px;word-break:break-all;-webkit-user-select:text;user-select:text}
a.btn{text-decoration:none;display:inline-block}
.net{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;color:var(--gold);white-space:nowrap}
@media (max-width:420px){
  .row{grid-template-columns:4px 46px 1fr 24px;gap:6px}
  .row b{font-size:15px}
  .dot{width:13px;height:13px;font-size:8px}
  .dots{gap:4px}
  .how li{font-size:14px}
}
@media (prefers-reduced-motion:reduce){.call.show .big{animation:none}}

/* ---------- Matchday skin: TV-broadcast look — condensed italic type, slanted plates, lime accent ---------- */
:root{--cond:'Barlow Condensed','Arial Narrow',sans-serif;--lime:#c6ff3d;--led:#c6ff3d;--navy:#070c1a;--slant:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%)}
.app:has(.screen:not([hidden])) .hud{display:none}
.screen{background:radial-gradient(130% 75% at 50% 0%,rgba(7,12,26,.25),rgba(7,12,26,.82) 55%,rgba(4,7,14,.97))}
.card{width:min(400px,100%);gap:14px}
.logo{display:flex;align-items:center;gap:14px;margin:0 0 16px}
.logo-ball{width:clamp(56px,15vw,78px);height:auto;aspect-ratio:1;animation:roll 14s linear infinite;filter:drop-shadow(0 10px 14px rgba(0,0,0,.6))}
@keyframes roll{to{transform:rotate(360deg)}}
.logo h1{margin:0;display:grid;text-align:left;font-family:var(--cond);font-style:italic;font-weight:900;font-size:clamp(52px,14vw,86px);line-height:.84;letter-spacing:-.01em}
.logo h1 span{color:#fff;text-shadow:0 6px 30px rgba(0,0,0,.6)}
.logo h1 span+span{color:var(--lime)}
.logo h1::after{content:"";display:block;height:5px;width:64%;margin-top:9px;background:var(--lime);transform:skewX(-20deg);transform-origin:left}
.btn{font-family:var(--cond);font-style:italic;font-weight:800;font-size:21px;letter-spacing:.05em;text-transform:uppercase;padding:13px 30px;border:0;border-radius:0;clip-path:var(--slant);background:var(--lime);color:#0b1400;box-shadow:none;position:relative;overflow:hidden;transition:transform .12s,filter .12s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:none;box-shadow:inset 0 0 0 3px #fff}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.5) 50%,transparent 70%);transform:translateX(-120%);pointer-events:none}
.btn.go::after{animation:shine 3s ease-in-out infinite}
@keyframes shine{0%,55%{transform:translateX(-120%)}85%,100%{transform:translateX(120%)}}
.btn.alt{background:#fff;color:var(--navy)}
.btn.alt:focus-visible{box-shadow:inset 0 0 0 3px var(--lime)}
.btn.ghost{background:rgba(255,255,255,.13);color:#fff;border:0;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.btn.wide{width:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:10px}
.btn.go{font-size:28px;padding:15px 30px}
.btn.go[disabled]::after{animation:none}
.btn svg{width:.72em;height:.72em;flex:none}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:none;border:0;padding:0;box-sizing:border-box}
.seg button{font-family:var(--cond);font-style:italic;font-weight:800;font-size:16px;letter-spacing:.07em;color:rgba(255,255,255,.62);padding:9px 4px;border-radius:0;clip-path:var(--slant);background:rgba(7,12,26,.85)}
.seg button[aria-pressed="true"]{background:#fff;color:var(--navy);box-shadow:inset 0 -4px 0 var(--lime)}
.foot{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:2px}
.pill{font-family:var(--cond);font-style:italic;font-weight:700;font-size:15px;letter-spacing:.08em;color:rgba(255,255,255,.72);background:rgba(7,12,26,.85);padding:6px 20px;clip-path:var(--slant)}
.pill b{color:var(--lime);font-weight:800}.pill em{color:#ff6b72;font-weight:800}
.qbtn{width:34px;height:34px;border-radius:50%;border:1.5px solid rgba(255,255,255,.3);background:rgba(7,12,26,.85);color:#fff;font-family:var(--cond);font-weight:800;font-size:17px;cursor:pointer;display:grid;place-items:center;padding:0}
.qbtn[aria-expanded="true"]{background:var(--lime);color:#0b1400;border-color:var(--lime)}
.qbtn:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.howpop{display:grid;gap:10px;width:100%;box-sizing:border-box;background:rgba(7,12,26,.9);border-left:4px solid var(--lime);padding:12px 16px;text-align:left;font-weight:600;font-size:15px}
.howpop div{display:flex;gap:12px;align-items:center}
.howpop b{font-family:var(--cond);font-style:italic;font-weight:900;font-size:22px;color:var(--lime);width:14px;flex:none}
.eyebrow,.record{font-family:var(--cond);font-style:italic;font-weight:800;font-size:15px;letter-spacing:.18em;color:var(--lime)}
.record{color:var(--muted);font-weight:700}
.screen .title{font-family:var(--cond);font-style:italic;font-weight:900;font-size:clamp(52px,15vw,92px)!important;line-height:.86;letter-spacing:-.01em;text-transform:uppercase;color:#fff;text-shadow:0 8px 34px rgba(0,0,0,.7)}
.screen .title.win{color:var(--lime)}
.fld span{font-family:var(--cond);font-style:italic;font-weight:800;font-size:13px;letter-spacing:.18em}
.fld input{border:0;border-bottom:2px solid rgba(255,255,255,.25);background:rgba(7,12,26,.75);border-radius:0;font-size:18px}
.fld input:focus{border-color:var(--lime)}
.linkbox{background:rgba(7,12,26,.88);border:0;border-left:4px solid var(--lime);border-radius:0;color:#fff}
.actions{width:100%}.actions .btn{flex:1 1 0;padding-inline:12px}
.role{font-family:var(--cond);font-style:italic;font-weight:900;font-size:clamp(30px,6vw,44px);letter-spacing:.01em;text-transform:uppercase}
.hint{font-weight:600}
.call .big{font-family:var(--cond);font-style:italic;font-weight:900;font-size:clamp(72px,17vw,160px);line-height:.86;padding:0 16px;text-wrap:balance;letter-spacing:-.01em;text-shadow:0 8px 40px rgba(0,0,0,.75)}
.call.good .big{color:var(--lime);text-shadow:0 0 44px rgba(198,255,61,.45),0 8px 40px rgba(0,0,0,.7)}
.call .sub{font-family:var(--cond);font-style:italic;font-weight:700;font-size:22px;letter-spacing:.02em}
.dot.goal{background:var(--lime);border-color:var(--lime);color:#0b1400}
.dot.next{box-shadow:0 0 0 3px rgba(198,255,61,.3)}
#strike{width:100%}
.seg,#meter{display:none!important}
/* online lobby */
.duo{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;width:100%}
.pl{display:grid;gap:2px;padding:10px 8px;background:rgba(7,12,26,.88);clip-path:var(--slant);min-width:0}
.pl b{font-family:var(--cond);font-style:italic;font-weight:900;font-size:22px;letter-spacing:.04em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl small{font-family:var(--cond);font-style:italic;font-weight:800;font-size:12px;letter-spacing:.14em;color:var(--muted)}
.pl.me{box-shadow:inset 0 -4px 0 var(--you)}.pl.them{box-shadow:inset 0 -4px 0 var(--rival)}
.pl.ok small{color:var(--lime)}.pl.wait small{color:var(--gold)}
.pl.talking{outline:2px solid var(--lime);outline-offset:-2px}
.duo .vs{font-family:var(--cond);font-style:italic;font-weight:900;font-size:18px;color:var(--muted)}
.codebox{display:grid;justify-items:center;gap:0;width:100%;background:rgba(7,12,26,.88);padding:8px 0 10px;clip-path:var(--slant)}
.codebox small{font-family:var(--cond);font-style:italic;font-weight:800;font-size:12px;letter-spacing:.2em;color:var(--muted)}
.codebox b{font-family:var(--cond);font-style:italic;font-weight:900;font-size:44px;letter-spacing:.18em;color:var(--lime);line-height:1}
.linkbox{font-size:12px;padding:6px 10px;opacity:.75}
.joinrow input{font-family:var(--cond);font-style:italic;font-weight:900;letter-spacing:.2em;text-transform:uppercase;background:rgba(7,12,26,.75);border:0;border-bottom:2px solid rgba(255,255,255,.25);border-radius:0}
.countdown{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;pointer-events:none;background:radial-gradient(circle at 50% 45%,rgba(7,12,26,.55),rgba(7,12,26,.85))}
.countdown small{font-family:var(--cond);font-style:italic;font-weight:800;font-size:16px;letter-spacing:.3em;color:var(--lime)}
.countdown b{font-family:var(--cond);font-style:italic;font-weight:900;font-size:clamp(96px,30vw,180px);line-height:.9;color:#fff;text-shadow:0 8px 40px rgba(0,0,0,.6)}
.countdown b.pop{animation:cdpop .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes cdpop{from{transform:scale(2.2);opacity:0}to{transform:none;opacity:1}}
.icon-btn.vc.on{background:var(--lime);color:#0b1400;border-color:var(--lime)}
.icon-btn.vc.muted{background:var(--rival);color:#fff;border-color:var(--rival)}
.icon-btn.vc.talking{box-shadow:0 0 0 4px rgba(198,255,61,.45)}
#vcBtn.on{background:var(--lime);color:#0b1400}#vcBtn.muted{background:var(--rival);color:#fff}
/* compact HUD text: nothing big over the pitch */
.role{font-size:clamp(20px,4.6vw,30px)!important}
.hint{font-size:13px}
.psub{display:inline-block;font-family:var(--cond);font-style:italic;font-weight:800;font-size:12px;letter-spacing:.18em;color:var(--muted);margin-bottom:2px}
.psub.hot{color:#fff;background:var(--rival);padding:0 8px}
.call{transform:none}
.call .big{font-size:clamp(30px,7.5vw,54px)!important;line-height:.95;padding:0 16px;text-shadow:0 3px 18px rgba(0,0,0,.85)}
.call.good .big{text-shadow:0 0 22px rgba(198,255,61,.35),0 3px 18px rgba(0,0,0,.85)}
.call .sub{font-size:15px;margin-top:2px}
.read,.port .read,.land .read{left:50%;right:auto;top:auto;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:auto;max-width:calc(100% - 32px);box-sizing:border-box;display:flex;align-items:center;gap:8px;padding:5px 18px;border:0;border-radius:0;clip-path:var(--slant);background:rgba(7,12,26,.82);white-space:nowrap}
.read b{font-family:var(--cond);font-style:italic;font-weight:800;font-size:13px;letter-spacing:.14em;color:var(--muted);margin-right:2px}
.read .c{font-family:var(--cond);font-style:italic;font-weight:800;font-size:15px;color:rgba(255,255,255,.6);padding:0 6px}
.read .c.hot{color:#0b1400;background:var(--lime)}
/* lower-third banner: ROUND 2 / MATCH POINT */
.banner{position:absolute;left:0;right:0;top:40%;transform:translateY(-50%);pointer-events:none;text-align:center;overflow:hidden;padding:6px 0}
.banner span{display:inline-block;font-family:var(--cond);font-style:italic;font-weight:900;font-size:clamp(30px,7vw,54px);letter-spacing:.05em;color:var(--navy);background:#fff;padding:2px 38px;clip-path:var(--slant);box-shadow:inset 0 -5px 0 var(--lime);animation:sweep 1.3s cubic-bezier(.2,.8,.2,1) both}
.banner.hot span{background:var(--rival);color:#fff;box-shadow:inset 0 -5px 0 #fff}
@keyframes sweep{0%{transform:translateX(-110vw)}20%{transform:translateX(0)}80%{transform:translateX(0);opacity:1}100%{transform:translateX(110vw);opacity:0}}
/* full-time screen */
#over .card{position:relative;z-index:1;gap:14px}
#over .rays{position:fixed;inset:0;pointer-events:none;background:linear-gradient(112deg,transparent 38%,rgba(255,255,255,.06) 46%,transparent 54%),linear-gradient(68deg,transparent 38%,rgba(255,255,255,.06) 46%,transparent 54%);animation:sway 6s ease-in-out infinite alternate}
@keyframes sway{to{transform:translateX(5%)}}
#over.won{background:radial-gradient(90% 55% at 50% 8%,rgba(198,255,61,.17),transparent 62%),radial-gradient(130% 75% at 50% 0%,rgba(7,12,26,.3),rgba(7,12,26,.85) 55%,rgba(4,7,14,.97))}
#over.lost{background:radial-gradient(90% 55% at 50% 8%,rgba(226,61,75,.2),transparent 62%),radial-gradient(130% 75% at 50% 0%,rgba(7,12,26,.3),rgba(7,12,26,.85) 55%,rgba(4,7,14,.97))}
#over:not([hidden]) .title{animation:slam .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes slam{from{transform:scale(1.8);opacity:0}to{transform:none;opacity:1}}
.scoreline{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;width:100%;filter:drop-shadow(0 10px 24px rgba(0,0,0,.5))}
.scoreline .team{display:flex;align-items:center;min-width:0;padding:0 14px;color:#fff}
.scoreline .team b{font-family:var(--cond);font-style:italic;font-weight:900;font-size:22px;letter-spacing:.05em;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.scoreline .team.you{background:var(--you);justify-content:flex-end;clip-path:polygon(14px 0,100% 0,100% 100%,0 100%)}
.scoreline .team.rival{background:var(--rival);clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%)}
.final{font-family:var(--cond);font-style:italic;font-weight:900;font-size:clamp(52px,14vw,74px);line-height:1;background:#fff;color:var(--navy);padding:4px 16px;font-variant-numeric:tabular-nums;letter-spacing:0}
.final span{color:#9aa3b5;font-weight:700;margin:0 4px}
.final b{font-weight:900}
.seq{width:100%;gap:8px}
.seqrow{display:grid;grid-template-columns:72px 1fr;align-items:center;gap:10px}
.seqrow b{font-family:var(--cond);font-style:italic;font-weight:800;font-size:15px;letter-spacing:.07em;text-align:right;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seq .dots{justify-content:flex-start;flex-wrap:wrap}
#over .dot{width:22px;height:22px;font-size:12px}
.dot.pre{opacity:0;transform:scale(.2)}
.dot.pop{animation:dotpop .35s cubic-bezier(.2,1.8,.4,1) both}
@keyframes dotpop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
.statrow{display:grid;grid-template-columns:auto 1fr;gap:6px;width:100%}
.rating{display:grid;place-items:center;align-content:center;background:var(--lime);color:#0b1400;padding:6px 22px;clip-path:var(--slant);min-width:92px}
.rating span{font-family:var(--cond);font-style:italic;font-weight:800;font-size:11px;letter-spacing:.16em}
.rating b{font-family:var(--cond);font-style:italic;font-weight:900;font-size:40px;line-height:.95;font-variant-numeric:tabular-nums}
.rating.motm::after{content:"MAN OF THE MATCH";font-family:var(--cond);font-style:italic;font-weight:800;font-size:10px;letter-spacing:.08em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stat{background:rgba(7,12,26,.88);padding:8px 4px;display:grid;gap:2px;align-content:center;clip-path:var(--slant)}
.stat b{font-family:var(--cond);font-style:italic;font-weight:900;font-size:26px;color:#fff;line-height:1}
.stat span{font-family:var(--cond);font-style:italic;font-weight:700;font-size:11px;letter-spacing:.14em;color:var(--muted)}
.row.you .chip{background:var(--you)}.row.rival .chip{background:var(--rival)}
.scoreline .team.you{color:var(--you-ink,#fff)}.scoreline .team.rival{color:var(--rival-ink,#fff)}
/* role card: who you are this kick */
.banner .rc{display:inline-grid;justify-items:center;gap:2px;padding:8px 44px 10px;clip-path:var(--slant);animation:sweep 1.5s cubic-bezier(.2,.8,.2,1) both}
.banner .rc small{font-family:var(--cond);font-style:italic;font-weight:800;font-size:14px;letter-spacing:.2em;opacity:.85}
.banner .rc span{display:flex;align-items:center;gap:12px;font-family:var(--cond);font-style:italic;font-weight:900;font-size:clamp(34px,8vw,60px);line-height:.95;letter-spacing:.03em;background:none;padding:0;clip-path:none;box-shadow:none;animation:none;color:inherit}
.banner .rc svg{width:.85em;height:.85em;flex:none}
.banner.shoot .rc{background:var(--you);color:var(--you-ink,#fff)}
.banner.keep .rc{background:var(--lime);color:#0b1400}
.banner.hot .rc small{background:var(--rival);color:#fff;padding:1px 10px;opacity:1}
/* screen edge colour: your team colour when shooting, lime when in goal */
.roleframe{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s}
.roleframe.shoot{opacity:1;box-shadow:inset 0 0 140px color-mix(in srgb,var(--you) 16%,transparent)}
.roleframe.keep{opacity:1;box-shadow:inset 0 0 140px rgba(198,255,61,.12)}
.replaytag{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(70px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:8px;font-family:var(--cond);font-style:italic;font-weight:900;font-size:22px;letter-spacing:.12em;color:#fff;background:rgba(7,12,26,.85);padding:4px 16px;clip-path:var(--slant);pointer-events:none}
.replaytag i{width:10px;height:10px;border-radius:50%;background:var(--rival);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.replayskip{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));font-family:var(--cond);font-style:italic;font-weight:700;font-size:14px;letter-spacing:.14em;color:rgba(255,255,255,.75);pointer-events:none}
/* team picker */
.teamsel{display:grid;grid-template-columns:44px 1fr 44px;gap:6px;width:100%;align-items:stretch}
.tarrow{appearance:none;border:0;background:rgba(7,12,26,.85);color:#fff;font-size:26px;line-height:1;cursor:pointer;clip-path:var(--slant);padding:0}
.tarrow:focus-visible{background:var(--lime);color:#0b1400;outline:none}
.tcur{display:flex;align-items:center;justify-content:center;gap:12px;background:rgba(7,12,26,.85);clip-path:var(--slant);padding:4px 10px;min-width:0}
.tcur canvas{width:26px;height:62px;flex:none}
.tcur b{font-family:var(--cond);font-style:italic;font-weight:900;font-size:24px;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcur small{display:block;font-family:var(--cond);font-style:italic;font-weight:700;font-size:11px;letter-spacing:.2em;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.logo-ball,.btn.go::after,#over .rays,.banner span,.banner .rc,#over .title,.dot.pop,.replaytag i{animation:none}}
</style>
</head>
<body>
<div class="app port" id="app">
  <canvas id="cv" aria-label="Penalty shootout. Tap a spot in the goal."></canvas>

  <div class="hud">
    <div class="top">
      <div class="board" aria-live="polite">
        <div class="bhead"><span id="bRound">PENALTIES</span><b id="bDiff">PRO</b></div>
        <div class="rows">
          <div class="row you"><i class="chip"></i><b>YOU</b><span class="dots" id="dYou"></span><em class="sc" id="sYou">0</em></div>
          <div class="row rival"><i class="chip"></i><b id="rivalName">RIVAL</b><span class="dots" id="dRival"></span><em class="sc" id="sRival">0</em></div>
        </div>
      </div>
      <button class="icon-btn vc" id="vcHud" hidden aria-label="Voice chat"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-2.1A7 7 0 0 0 19 12z"/></svg></button>
      <button class="icon-btn" id="mute" aria-label="Mute sound">
        <svg id="icoOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/></svg>
        <svg id="icoOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" hidden><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
      </button>
    </div>
    <div class="prompt" id="prompt" hidden>
      <div class="psub" id="psub"></div>
      <div class="role" id="role"></div>
      <div class="hint" id="hint"></div>
      <div class="tbar"><i id="tbar"></i></div>
    </div>
    <div class="read" id="read" hidden></div>
    <div class="meter" id="meter" hidden>
      <div class="lbl"><span id="mZone"></span></div>
      <div class="track"><div class="needle" id="needle"></div></div>
      <button class="btn" id="strike">STRIKE</button>
    </div>
  </div>

  <div class="net" id="netNote" hidden></div>
  <div class="roleframe" id="roleFrame"></div>
  <div class="countdown" id="cd" hidden><small>KICK-OFF</small><b id="cdNum">3</b></div>
  <div class="banner" id="banner" hidden><div class="rc"><small id="bannerSub"></small><span id="bannerTxt"></span></div></div>
  <div class="replaytag" id="replayTag" hidden><i></i>REPLAY</div>
  <div class="replayskip" id="replaySkip" hidden>TAP TO SKIP</div>
  <div class="call" id="call" hidden><div class="big" id="callBig"></div><div class="sub" id="callSub"></div></div>

  <div class="screen" id="menu">
    <div class="card">
      <div class="logo"><img class="logo-ball" src="game/ball.webp" alt=""><h1 aria-label="Twelve Yards"><span>TWELVE</span><span>YARDS</span></h1></div>
      <div class="teamsel" data-teamsel></div>
      <div class="seg" role="group" aria-label="Difficulty">
        <button data-d="0" aria-pressed="false">AMATEUR</button>
        <button data-d="1" aria-pressed="true">PRO</button>
        <button data-d="2" aria-pressed="false">LEGEND</button>
      </div>
      <button class="btn go wide" id="start" disabled>LOADING</button>
      <button class="btn alt wide" id="playFriend"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="8" cy="8" r="4"/><circle cx="17" cy="9" r="3"/><path d="M1 21c0-4 3-7 7-7s7 3 7 7zM14 21c0-2-.6-3.8-1.6-5.2A5 5 0 0 1 23 19v2z"/></svg>VS FRIEND</button>
      <div class="foot"><span class="pill" id="record"></span><button class="qbtn" id="howBtn" aria-expanded="false" aria-controls="howPop" aria-label="How to play">?</button></div>
      <div class="howpop" id="howPop" hidden>
        <div><b>1</b>Tap a spot in the goal</div>
        <div><b>2</b>Stop the meter on green</div>
        <div><b>3</b>In goal, tap where you dive</div>
      </div>
    </div>
  </div>

  <div class="screen" id="lobby" hidden>
    <div class="card">
      <div class="eyebrow" id="lobbyEyebrow">ONLINE 1V1</div>
      <div class="title" id="lobbyTitle">VS FRIEND</div>
      <div class="duo" id="duo" hidden>
        <div class="pl me"><b id="pMe">YOU</b><small id="pMeS">JOINED</small></div>
        <span class="vs">VS</span>
        <div class="pl them"><b id="pThem">WAITING…</b><small id="pThemS">SHARE THE LINK</small></div>
      </div>
      <label class="fld" for="nick"><span>YOUR NAME</span><input id="nick" maxlength="12" autocomplete="off" placeholder="e.g. Samer"></label>
      <div class="teamsel" data-teamsel></div>
      <div id="inviteBox" class="lgrid" hidden>
        <div class="codebox"><small>MATCH CODE</small><b id="codeOut"></b></div>
        <div class="actions"><button class="btn wide" id="shareBtn">SHARE LINK</button><button class="btn ghost wide" id="copyLink">COPY LINK</button></div>
        <div class="linkbox" id="linkOut"></div>
        <div class="joinrow"><input id="codeIn" maxlength="8" autocomplete="off" placeholder="FRIEND'S CODE" aria-label="Friend's match code"><button class="btn ghost" id="codeGo">JOIN</button></div>
      </div>
      <div id="joinBox" class="lgrid" hidden>
        <button class="btn go wide" id="joinPlay">JOIN MATCH</button>
      </div>
      <button class="btn alt wide" id="vcBtn" hidden><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-2.1A7 7 0 0 0 19 12z"/></svg><span id="vcBtnTxt">VOICE CHAT</span></button>
      <div class="lobbymsg" id="lobbyMsg"></div>
      <button class="btn ghost" id="lobbyBack">LEAVE</button>
    </div>
  </div>

  <div class="screen" id="over" hidden>
    <div class="rays" aria-hidden="true"></div>
    <div class="card">
      <div class="eyebrow" id="oEyebrow">FULL TIME</div>
      <div class="title" id="oTitle">VICTORY</div>
      <div class="scoreline"><div class="team you"><b>YOU</b></div><div class="final" id="oScore">0<span>–</span>0</div><div class="team rival"><b class="rivalNm">RIVAL</b></div></div>
      <div class="seq">
        <div class="seqrow"><b>YOU</b><div class="dots" id="oYou"></div></div>
        <div class="seqrow"><b class="rivalNm">RIVAL</b><div class="dots" id="oRival"></div></div>
      </div>
      <div class="statrow"><div class="rating" id="oRating"><span>RATING</span><b id="oRate">–</b></div><div class="stats" id="oStats"></div></div>
      <div class="record" id="oRecord"></div>
      <button class="btn go wide" id="again">REMATCH</button>
      <div class="actions">
        <button class="btn ghost" id="copy">SHARE</button>
        <button class="btn ghost" id="menuBtn">MENU</button>
      </div>
      <div class="copied" id="copied"></div>
      <pre class="sharebox" id="shareBox" hidden></pre>
    </div>
  </div>
</div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const cv=$('#cv'), ctx=cv.getContext('2d');ctx.imageSmoothingQuality='high';
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const easeOut=t=>1-Math.pow(1-clamp(t,0,1),3), easeIn=t=>Math.pow(clamp(t,0,1),2), easeIO=t=>{t=clamp(t,0,1);return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2};
const rnd=(a,b)=>a+Math.random()*(b-a);
const pickW=w=>{const s=w.reduce((a,b)=>a+b,0);let r=Math.random()*s;for(let i=0;i<w.length;i++){r-=w[i];if(r<=0)return i}return w.length-1};
const real=()=>performance.now()/1000;

/* ---------------- Assets (rendered on Higgsfield) ---------------- */
const BG={
  land:{src:'game/bg_land.webp',w:2688,h:1520,gl:852/2688,gr:1832/2688,gt:506/1520,gb:842/1520,bt:.4743,bb:.5296},
  port:{src:'game/bg_port.webp',w:1520,h:2688,gl:132/1520,gr:1386/1520,gt:834/2688,gb:1287/2688,bt:.4163,bb:.4565}
};
// player art (Higgsfield, GPT Image 2.5). fx: feet x · ax/ay: glove anchor for dives · bx: body centre · hr: height vs the base pose, so the player stays the same size
const SPR={k_idle:{fx:.526,hr:1},k_set:{fx:.526,hr:.996},k_dive_high:{ax:.997,ay:.153,bx:.531,hr:.776},k_dive_low:{ax:.997,ay:.663,bx:.495,hr:.521},
  k_jump:{fx:.649,hr:1.432},k_crouch:{fx:.507,hr:.956},k_cele:{fx:.497,hr:1.142},k_sad:{fx:.526,hr:1.038},
  p_stand:{fx:.503,hr:1},p_run1:{fx:.372,hr:1.008},p_run2:{fx:.413,hr:.977},p_kick:{fx:.704,hr:.982},p_follow:{fx:.614,hr:1.053},p_cele:{fx:.506,hr:1.19},p_sad:{fx:.509,hr:.994}};
const POSES=['stand','run1','run2','kick','follow','cele','sad'];
const IMG={};let loaded=0,total=0;
function load(key,src){total++;const im=new Image();im.decoding='async';im.onload=()=>{loaded++;if(key.startsWith('bg_'))prepNet(key);onProgress()};im.onerror=()=>{loaded++;onProgress()};im.src=src;IMG[key]=im}
load('bg_land',BG.land.src);load('bg_port',BG.port.src);
Object.keys(SPR).forEach(k=>load(k,'game/'+k+'.webp'));load('ball','game/ball.webp');
function onProgress(){const b=$('#start');if(loaded>=total){renderTeamSel();if(PX.ok)PX.bake={};b.disabled=false;b.innerHTML='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 3.5l15 8.5-15 8.5z"/></svg>PLAY';resize()}else b.textContent=`LOADING ${Math.round(loaded/total*100)}%`}
const NET={};
function prepNet(key){ // copy the white net/post pixels over the LED band so scrolling text sits behind the net
  try{
    const b=BG[key.slice(3)],im=IMG[key];
    const x0=Math.floor((b.gl-.012)*b.w),x1=Math.ceil((b.gr+.012)*b.w),y0=Math.floor(b.bt*b.h)-2,y1=Math.ceil(b.bb*b.h)+2;
    const c=document.createElement('canvas');c.width=x1-x0;c.height=y1-y0;const g=c.getContext('2d');
    g.drawImage(im,x0,y0,c.width,c.height,0,0,c.width,c.height);
    const d=g.getImageData(0,0,c.width,c.height),p=d.data;
    for(let i=0;i<p.length;i+=4){const mn=Math.min(p[i],p[i+1],p[i+2]);const a=clamp((mn-150)/50,0,1);p[i+3]=a*255}
    g.putImageData(d,0,0);NET[key]={c,x0,y0};
  }catch(e){}
}

/* ---------------- Teams: the blue kit is repainted in each team's colour, shading kept ---------------- */
const TEAMS=[['BHR','Bahrain','#d01c2a'],['KSA','Saudi Arabia','#0e8a43'],['UAE','UAE','#f2f2f2'],['QAT','Qatar','#7d1538'],['KUW','Kuwait','#1f63c6'],
  ['BRA','Brazil','#f6d200'],['ARG','Argentina','#75b9ee'],['FRA','France','#1c2a5a'],['ESP','Spain','#c8102e'],['ENG','England','#f5f5f5'],['NED','Netherlands','#f36f21']];
const teamOf=c=>TEAMS.find(t=>t[0]===c)||TEAMS[0];
const hex2rgb=h=>{const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]};

function resize(){
  const r=cv.getBoundingClientRect();W=r.width;H=r.height;DPR=Math.min(W*H<=520000?3:2,window.devicePixelRatio||1); // phones render at their full sharpness
  if(PX.ok){cv.width=cv.height=1}else{cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR)} // with the GPU renderer, #cv only catches taps
  layout();placeHud();if(PX.ok)pxLayout();
}
function layout(){
  const land=W/H>=.85,b=land?BG.land:BG.port;
  $('#app').className='app '+(land?'land':'port');
  const cover=Math.max(W/b.w,H/b.h),fit=W*.94/((b.gr-b.gl)*b.w);
  const s=Math.min(cover,fit),dw=b.w*s,dh=b.h*s,ox=(W-dw)/2;
  let oy;if(dh<=H)oy=H-dh;else oy=clamp(H*(land?.56:.54)-b.gb*dh,H-dh,0);
  const gl=ox+b.gl*dw,gr=ox+b.gr*dw,gt=oy+b.gt*dh,gb=oy+b.gb*dh,gw=gr-gl,gh=gb-gt,cx=(gl+gr)/2;
  L={land,b,key:land?'bg_land':'bg_port',s,ox,oy,dw,dh,gl,gr,gt,gb,gw,gh,cx,bt:oy+b.bt*dh,bb:oy+b.bb*dh};
  L.spot={x:cx,y:gb+(H-gb)*(land?.6:.56)};
  L.r0=clamp(gw*.038,7,26);L.r1=Math.max(2.5,gw*.0145);
  L.sh=Math.min(gh*2.6,(H-gb)*.86);
  L.sx0=cx-L.sh*.17-Math.min(gw*.08,L.sh*.16);L.sy0=Math.min(L.spot.y+L.sh*.13,H-6);
  L.sx1=cx-L.sh*.17;L.sy1=Math.min(L.spot.y+L.sh*.08,H-6);
  L.zones=[];
  for(let r=0;r<2;r++)for(let c=0;c<3;c++)L.zones.push({c,r,
    x:gl+gw*[.13,.5,.87][c],y:gt+gh*[.24,.74][r],rx:gl+gw*c/3,ry:gt+gh*r/2,rw:gw/3,rh:gh/2,
    kx:gl+gw*[.15,.5,.85][c],ky:gt+gh*[.2,.8][r]});
}

  if(!L)return;
  $('#call').style.top=($('.top').getBoundingClientRect().bottom+6)+'px';

function spr(key,x,y,h,o={}){ // draw sprite with feet (fx) at x,y and height h
  const im=o.im||IMG[key],iw=im&&(im.naturalWidth||im.width),ih=im&&(im.naturalHeight||im.height);if(!iw)return;
  const w=h*iw/ih,fx=(SPR[key].fx??.5);
  if(PX.on){const tx=pxSharp(im,h)||pxTex(im),sp=pxSpr(tx);sp.anchor.set(fx,1);sp.position.set(x,y);sp.rotation=o.rot||0;sp.scale.set((o.flip?-1:1)*w/tx.width,(o.sy||1)*h/tx.height);sp.alpha=o.alpha??1;return}
  ctx.save();ctx.globalAlpha=o.alpha??1;ctx.translate(x,y);if(o.rot)ctx.rotate(o.rot);if(o.flip)ctx.scale(-1,1);
  if(o.sy)ctx.scale(1,o.sy);
  ctx.drawImage(im,-w*fx,-h,w,h);ctx.restore();
}
function sprAnchor(key,ax,ay,h,flip,rot,alpha){ // draw with an anchor point (fractions) placed at ax,ay
  const im=IMG[key];if(!im||!im.naturalWidth)return;
  const w=h*im.naturalWidth/im.naturalHeight,a=SPR[key];
  if(PX.on){const tx=pxSharp(im,h)||pxTex(im),sp=pxSpr(tx);sp.anchor.set(a.ax,a.ay);sp.position.set(ax,ay);sp.rotation=rot||0;sp.scale.set((flip?-1:1)*w/tx.width,h/tx.height);sp.alpha=alpha??1;return}
  ctx.save();ctx.globalAlpha=alpha??1;ctx.translate(ax,ay);if(rot)ctx.rotate(rot);if(flip)ctx.scale(-1,1);
  ctx.drawImage(im,-w*a.ax,-h*a.ay,w,h);ctx.restore();
}
function shadow(x,y,rx,ry,a){if(PX.on){const sp=pxSpr(PX.T.shadow);sp.anchor.set(.5);sp.position.set(x,y);sp.scale.set(rx/64,ry/64);sp.alpha=a;return}ctx.save();const g=ctx.createRadialGradient(x,y,0,x,y,rx);g.addColorStop(0,`rgba(0,0,0,${a})`);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.translate(x,y);ctx.scale(1,ry/rx);ctx.translate(-x,-y);ctx.beginPath();ctx.arc(x,y,rx,0,6.29);ctx.fill();ctx.restore()}

/* ---------------- Keeper ---------------- */
// Keeper state is computed from the current anim; returns a draw function
function drawKeeper(t){
  const a=S.anim,gh=L.gh,KH=keeperH(),kh=k=>KH*SPR[k].hr;
  const tense=a&&!a.fired&&t>a.t0?1:0;
  const sway=Math.sin(t*2.2)*L.gw*.012+tense*Math.sin(t*7.5)*L.gw*.01,hop=Math.abs(Math.sin(t*(4.4+tense*3)))*gh*(.012+tense*.01);
  const pose=(k,x,lift=0,alpha=1)=>{if(alpha<=0)return;shadow(x,L.gb,gh*.23,gh*.045,.45*alpha);spr(k,x,L.gb-lift,kh(k),{alpha})};
  // after the play: a save -> roar with little hops; a goal -> hands on hips; otherwise back to ready
  const react=(x,alpha=1)=>{
    if(a.fired&&a.outcome==='save'){const c=t-a.fireT;pose('k_cele',x,Math.abs(Math.sin(c*6))*gh*.04*Math.max(0,1-c/2.4),alpha)}
    else if(a.fired&&a.outcome==='goal')pose('k_sad',x,0,alpha);else pose('k_idle',x,0,alpha);
  };
  if(!a||a.kz===undefined||t<a.kick-.1){
    if(a&&t>a.kick-.4){pose('k_set',L.cx);return} // drops into his set position
    pose('k_idle',L.cx+sway,hop);return;
  }
  const z=a.kz,tt=t-(a.kick-.1),p=clamp(tt/.46,0,1);
  if(z<0){if(p<.3)pose('k_set',L.cx);else react(L.cx);return} // stood his ground
  const Z=L.zones[z];
  if(Z.c===1){
    if(p<.12){pose('k_set',L.cx);return}
    const k=Z.r===0?'k_jump':'k_crouch',dur=Z.r===0?.9:.95;
    if(tt<dur){const up=Z.r===0?Math.sin(Math.PI*clamp(tt/.9,0,1)):0;shadow(L.cx,L.gb,gh*.22,gh*.045,.42*(1-up*.5));spr(k,L.cx,L.gb-up*gh*.14,kh(k));return}
    react(L.cx);return;
  }
  const flip=Z.c===0,high=Z.r===0,key=high?'k_dive_high':'k_dive_low',A=SPR[key],h=kh(key);
  const im=IMG[key],w=im&&im.naturalWidth?h*im.naturalWidth/im.naturalHeight:h*2;
  const tx=Z.kx,ty=Z.ky,sx=L.cx+(flip?-1:1)*gh*.22,sy=L.gb-gh*.55;
  if(p<.1){pose('k_set',L.cx);return}
  const q=easeOut((p-.1)/.9);
  let ax=lerp(sx,tx,q),ay=lerp(sy,ty,q)-Math.sin(Math.PI*q)*gh*(high?.12:.04);
  let rot=lerp((flip?1:-1)*(high?.9:1.1),0,q);
  const after=tt-.46,restY=L.gb-h*(1-A.ay)*.95;
  if(after>0){const fall=easeIn(clamp(after/.4,0,1));ay=lerp(ty,Math.max(ty,restY),fall);rot=(flip?-1:1)*fall*.08;
    const bt=after-.4;if(bt>0&&bt<.25)ay-=Math.sin(Math.PI*bt/.25)*gh*.035} // small bounce on landing
  const bodyX=ax+(flip?1:-1)*w*(A.ax-A.bx);
  const GET=1.05,UP=.35;
  if(tt>GET){ // gets up where he landed and reacts
    react(clamp(bodyX,L.gl+L.gw*.12,L.gr-L.gw*.12));return;
  }
  shadow(bodyX,L.gb,w*.5,gh*.05,.35+.2*(after>0?1:q));
  sprAnchor(key,ax,ay,h,flip,rot,1);
}

/* ---------------- Shooter ---------------- */
function blendFrames(seq,t,fade){ // the frame to show now, cross-faded into the next one near each switch
  let i=0;while(i+1<seq.length&&t>=seq[i+1][0])i++;
  const nx=seq[i+1];if(nx&&t>nx[0]-fade)return[[seq[i][1],1],[nx[1],(t-(nx[0]-fade))/fade]];return[[seq[i][1],1]];
}
function drawShooter(t){
  const a=S.anim,youShoot=a?a.shooter==='you':youShooting(),h=L.sh,hex=youShoot?TM.youHex:TM.rivHex;
  let x=L.sx0,y=L.sy0,sc=1,bob=0,frames=[['stand',1]];
  if(a){
    const T0=a.t0+.05,T1=a.kick-.08,run=clamp((t-T0)/(T1-T0),0,1),e=easeIO(run);
    x=lerp(L.sx0,L.sx1,e);y=lerp(L.sy0,L.sy1,e);sc=lerp(1,.95,e);
    // stand -> jog -> plant -> strike -> follow-through -> celebrate or despair
    const seq=[[-1,'stand'],[T0+.06,'run1'],[lerp(T0,T1,.6),'run2'],[a.kick-.06,'kick'],[a.kick+.12,'follow']];
    if(a.fired)seq.push([a.fireT+.3,a.outcome==='goal'?'cele':'sad']);
    frames=blendFrames(seq,t,0);
    if(run>0&&run<1)bob=Math.abs(Math.sin(run*Math.PI*2))*h*.012;
    if(a.fired&&a.outcome==='goal'&&t>a.fireT+.3)bob=Math.abs(Math.sin((t-a.fireT)*5))*h*.03;
  }
  shadow(x,y,h*.22*sc,h*.05*sc,.5);
  for(const [po,al] of frames){const k='p_'+po;spr(k,x,y-bob,h*sc*SPR[k].hr,{im:kitPose(hex,po)||undefined,alpha:al})}
}

/* ---------------- Ball ---------------- */
function drawBall(x,y,r,ang,alpha=1){
  if(PX.on){pxBall(x,y,r,ang,alpha);return}
  const im=IMG.ball;ctx.save();ctx.globalAlpha=alpha;ctx.translate(x,y);ctx.rotate(ang);
  if(im&&im.naturalWidth)ctx.drawImage(im,-r,-r,r*2,r*2);else{ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,r,0,6.29);ctx.fill()}
  ctx.rotate(-ang);const g=ctx.createRadialGradient(-r*.3,-r*.35,r*.2,0,0,r);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(0,0,10,.16)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r,0,6.29);ctx.fill();
  ctx.restore();
}
const K=()=>L.r0/L.r1-1;
function proj(z){return 1/(1+K()*z)} // perspective scale relative to the spot
function ballAt(a,z){ // z: 0 at spot, 1 at goal plane, >1 beyond
  const s=proj(z),s1=proj(1),f=(1-s)/(1-s1);
  const x=lerp(L.spot.x,a.tx,f),y=lerp(L.spot.y,a.ty,f)-Math.sin(Math.PI*clamp(z,0,1))*a.arc*s;
  const gy=lerp(L.spot.y+L.r0*.85,L.gb,Math.min(f,1.05));
  return{x,y,r:L.r0*s,gy,s};
}

function botShot(){
  const D=DIFF[diff],dc=[0,0,0];S.hist.youDives.forEach(z=>{if(z>=0)dc[z%3]++});
  const lastSaved=S.hist.botShots.length&&S.res.rival[S.res.rival.length-1]==='miss';
  const w=[0,1,2].map(c=>(c===S.botFav?D.fav:1)*(c===1?.6:1)/(1+dc[c]*D.learn*.4)*(lastSaved&&S.hist.botShots[S.hist.botShots.length-1]%3===c?.5:1));
  const c=pickW(w);let r=Math.random()<(S.botHigh?.5:.3)*D.botTop?0:1;
  return{z:r*3+c,e:rnd(.04,.3)};
}
function botDive(){
  const D=DIFF[diff],cc=[0,0,0],rc=[0,0];
  S.hist.youShots.forEach((z,i)=>{const wgt=1+i*.25;cc[z%3]+=wgt;rc[(z/3)|0]+=wgt});
  const w=[];for(let z=0;z<6;z++){const c=z%3,r=(z/3)|0;w.push((1+cc[c]*D.learn)*(1+rc[r]*D.learn*.45)*(c===1?.6:1)*(c===S.botKeepFav?1.35:1))}

// same rules as the server (logic.js): you choose the spot, the keeper guesses; most kicks go in
function saveChance(sz,kz){
  const sc=sz%3,sr=(sz/3)|0;let p=0;
  if(kz<0)p=sc===1?(sr===1?.6:.35):0;
  else{const kc=kz%3,kr=(kz/3)|0;
    if(kc===sc){if(kr===sr)p=sc===1?.8:(sr===0?.6:.72);else p=sc===1?(kr===0?.35:.3):(sr===0?.25:.4)}
    else if(kc===1)p=.05;else if(sc===1)p=sr===1?.18:.08}
  return p;
}
const missChance=()=>0; // every shot is on target: goal or save
function launch(o,R=Math.random){

  const t=S.clock,Z=L.zones[o.zone],c=Z.c,r=Z.r,corner=c!==1,high=r===0;
  let outcome='goal',kind='';
  if(R()<missChance(o.zone)){outcome='miss';kind=high&&R()<.3?'bar':high&&(!corner||R()<.55)?'over':(R()<.3?'post':'wide')}
  else if(R()<saveChance(o.zone,o.kz))outcome='save';
  else if(high&&R()<.12)kind='barin';
  if(o.forced){outcome=o.forced.outcome;kind=o.forced.kind||(outcome==='miss'?'wide':'')}
  const j=o.e*L.gw*.05;
  let tx=Z.x+rr(-j,j),ty=Z.y+rr(-j,j)*.5;
  if(outcome==='miss'){
    if(kind==='over'){ty=L.gt-L.gh*rr(.3,.7);tx=clamp(tx,L.gl-L.gw*.1,L.gr+L.gw*.1)}
    else if(kind==='post'){const sd=R()<.5;tx=c===0?L.gl:c===2?L.gr:(sd?L.gl:L.gr);ty=high?L.gt+L.gh*.15:L.gt+L.gh*.6;if(c===1&&high){tx=Z.x;ty=L.gt}}
    else{const w=rr(.06,.14),sd=R()<.5;tx=c===0?L.gl-L.gw*w:c===2?L.gr+L.gw*w:(sd?L.gl-L.gw*.08:L.gr+L.gw*.08)}
  }else{tx=clamp(tx,L.gl+L.gw*.05,L.gr-L.gw*.05);ty=clamp(ty,L.gt+L.gh*.12,L.gb-L.gh*.1)}
  if(kind==='bar'||kind==='barin'){tx=clamp(Z.x+rr(-j,j),L.gl+L.gw*.06,L.gr-L.gw*.06);ty=L.gt+L.r1*.4}
  if(outcome==='save'&&o.kz>=0){const K2=L.zones[o.kz];tx=lerp(tx,K2.kx,.5);ty=lerp(ty,K2.ky,.5)}
  if(o.shooter==='you'){S.hist.youShots.push(o.zone);S.hist.botDives.push(o.kz)}else{S.hist.botShots.push(o.zone);S.hist.youDives.push(o.kz)}
  const decisive=wouldDecide(o.shooter);
  const replay=!RM&&(decisive||S.turn-S.lastReplay>=2)&&((outcome==='save'&&o.kz===o.zone)||kind==='bar'||kind==='barin'||kind==='post'||(outcome==='goal'&&corner&&high)||decisive);
  S.anim={...o,replay,t0:t,kick:t+.75,dur:.42+o.e*.14,outcome,kind,tx,ty,high,corner,fired:false,kicked:false,arc:L.gh*(high?.5:.14),
    slow:!RM&&(outcome==='save'||decisive||kind==='bar'||kind==='barin'||(outcome==='goal'&&corner&&high)),decisive,trail:[]};
  S.phase='flight';$('#meter').hidden=true;$('#prompt').hidden=true;$('#read').hidden=true;$('#roleFrame').className='roleframe';
}
function wouldDecide(who){ // would scoring/missing this kick end the match?
  const sim=(res)=>{const a=res.you.length,b=res.rival.length,ga=res.you.filter(x=>x==='goal').length,gb2=res.rival.filter(x=>x==='goal').length;
    if(a<=5&&b<=5&&(ga+(5-a)<gb2||gb2+(5-b)<ga))return true;if(a>=5&&b>=5&&a===b&&ga!==gb2)return true;return false};
  for(const r of ['goal','miss']){const c={you:[...S.res.you],rival:[...S.res.rival]};c[who].push(r);if(sim(c))return true}
  return false;
}

  if(S.phase==='power'){const el=rt-S.meterStart,sp=S.speed*(1+DD().surge*Math.sin(el*3.1+S.mVar)+.25*Math.sin(el*7.3));S.mPhase+=dt*Math.max(1.5,sp);S.needle=.5+.5*Math.sin(S.mPhase);$('#needle').style.left=(S.needle*100)+'%'}
  if(a){
    if(!a.kicked&&t>=a.kick){a.kicked=true;AU.kick()}
    const trig=a.kick+a.dur*(a.outcome==='save'?.86:1);
    if(!a.fired&&t>=trig)(a.isReplay?fireReplay:fire)(t);
    if(a.fired&&t>=a.next){if(a.isReplay)endReplay();else if(a.replay)startReplay(a,t);else{S.anim=null;S.turn++;startTurn()}}
  }
  S.excite=Math.max(0,S.excite-dt*.4);S.shake*=Math.pow(.02,dt);S.flash=Math.max(0,S.flash-dt*.9);S.zoom=Math.max(0,S.zoom-dt*.7);
  for(const p of S.particles){p.vy+=150*dt;p.vx*=.99;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;p.life-=dt}
  S.particles=S.particles.filter(p=>p.life>0&&p.y<H+20);
  for(const p of S.sparks){p.vy+=400*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}
  S.sparks=S.sparks.filter(p=>p.life>0);
  return t;
}
let lastF=real();
function loop(){const t=update(),n=real();pxPerf(n-lastF);lastF=n;(PX.ok?pxDraw:draw)(t);requestAnimationFrame(loop)}

/* ---------------- Input ---------------- */
function zoneAt(e){
  const r=cv.getBoundingClientRect(),C=S.cam,x=C.x+(e.clientX-r.left-W/2)/C.z,y=C.y+(e.clientY-r.top-H/2)/C.z,m=L.gw*.06;
  if(x<L.gl-m||x>L.gr+m||y<L.gt-m||y>L.gb+m*.6)return-1;
  return clamp(Math.floor((y-L.gt)/(L.gh/2)),0,1)*3+clamp(Math.floor((x-L.gl)/(L.gw/3)),0,2);
}
cv.addEventListener('pointerdown',e=>{AU.init();if(S.anim&&S.anim.isReplay){endReplay();return}if(S.phase==='power'){strike();return}const z=zoneAt(e);if(z<0)return;if(S.phase==='aim')pickAim(z);else if(S.phase==='keep')pickDive(z)});

/* ---------------- Online: 1v1 over the game server (rooms at /ws/<code>) ---------------- */
const ON={role:'',oppName:'',code:'',ws:null,retry:0,view:null,status:'',connected:0,named:false,want:false,closing:false,players:[],me:null,opp:null,counting:false};
const qs=new URLSearchParams(location.search);
const cleanName=s=>String(s||'').replace(/[^\p{L}\p{N} _.-]/gu,'').trim().slice(0,12);
let PID=null;
function pidGet(){ // one player per browser tab (two tabs on one phone = two players); a reload keeps the seat
  if(PID)return PID;let id=null;try{id=sessionStorage.getItem('ty:pid')}catch(e){}
  if(!id){id=Math.random().toString(36).slice(2,12);try{sessionStorage.setItem('ty:pid',id)}catch(e){}}return PID=id}
function lmsg(t,err){const m=$('#lobbyMsg');m.textContent=t||'';m.className='lobbymsg'+(err?' err':'')}
function myName(){return cleanName($('#nick').value)}
function inviteLink(code){return location.origin+'/?room='+code}
function wsSend(o){if(ON.ws&&ON.ws.readyState===1)ON.ws.send(JSON.stringify(o))}
function connectRoom(code){
  ON.code=code;ON.closing=false;
  const proto=location.protocol==='https:'?'wss:':'ws:';
  const ws=new WebSocket(`${proto}//${location.host}/ws/${encodeURIComponent('ty-'+code)}`);ON.ws=ws;
  ws.addEventListener('open',()=>{ON.retry=0;ON.lastPong=real();netNote('');wsSend(joinMsg());roomSave(code)});
  ws.addEventListener('message',ev=>{ON.lastPong=real();if(ev.data==='__pong')return;let m;try{m=JSON.parse(ev.data)}catch(e){return}
    if(m.type==='state')onState(m);else if(m.type==='rtc')vcSignal(m.data);else if(m.type==='error'&&!/stale|already/.test(m.error||''))console.warn('server:',m.error)});
  ws.addEventListener('close',()=>{if(ON.closing||ON.ws!==ws)return;ON.retry=Math.min(ON.retry+1,5);netNote('Connection lost. Reconnecting…');setTimeout(()=>{if(!ON.closing&&ON.ws===ws)connectRoom(code)},500*2**(ON.retry-1))});
}
function reconnect(){if(!ON.code||ON.closing)return;const old=ON.ws;ON.ws=null;try{old&&old.close()}catch(e){}connectRoom(ON.code)}
// heartbeat: phones silently kill connections in the background, so check every few seconds and reconnect if the server went quiet
setInterval(()=>{const ws=ON.ws;if(!ws||ON.closing)return;if(ws.readyState===1){ws.send('__ping');if(real()-(ON.lastPong||real())>15)reconnect()}else if(ws.readyState>1)reconnect()},5000);
// back in the game (after sharing the link on WhatsApp, switching apps, waking the phone): catch up at once
function netResync(){if(!ON.code||ON.closing)return;const ws=ON.ws;
  if(!ws||ws.readyState>1){reconnect();return}
  if(ws.readyState===1){const t0=real();wsSend(joinMsg());ws.send('__ping');setTimeout(()=>{if(ON.ws===ws&&(ON.lastPong||0)<t0)reconnect()},3000)}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)netResync()});
addEventListener('pageshow',netResync);addEventListener('focus',netResync);addEventListener('online',netResync);
function netNote(t){const n=$('#netNote');n.textContent=t;n.hidden=!t}
const roomSave=code=>{try{sessionStorage.setItem('ty:room',code)}catch(e){}},roomClear=()=>{try{sessionStorage.removeItem('ty:room')}catch(e){}};
const roomSaved=()=>{try{return sessionStorage.getItem('ty:room')}catch(e){return null}};
const joinMsg=()=>({type:'join',playerId:pidGet(),name:myName()||'Player',team:TM.you});
function showLobby(){$('#menu').hidden=true;$('#over').hidden=true;$('#lobby').hidden=false}
function renderDuo(me,opp,status){
  $('#duo').hidden=false;$('#joinBox').hidden=true;
  $('#pMe').textContent=(me.name||'YOU').toUpperCase();$('#pMeS').textContent=me.ready?'READY':'HERE';$('#pMe').parentElement.className='pl me ok';
  const th=$('#pThem').parentElement;
  if(!opp){$('#pThem').textContent='WAITING…';$('#pThemS').textContent='SHARE THE LINK';th.className='pl them wait'}
  else{$('#pThem').textContent=(opp.name||'FRIEND').toUpperCase();$('#pThemS').textContent=!opp.online?'AWAY':opp.ready?'READY':'JOINING…';th.className='pl them '+(opp.online&&opp.ready?'ok':'wait')}
  $('#inviteBox').hidden=!!opp||ON.role!=='host';
  lmsg(!opp?'Waiting for your friend to join…':!opp.online?`${opp.name||'Your friend'} stepped away. The match starts when they're back.`:status==='lobby'?'Both here. Starting…':'');
  vcUI();
}
function onState(m){
  ON.status=m.status;ON.connected=m.connected;ON.view=m.view;ON.players=m.players||[];
  const me=ON.players.find(p=>p.id===pidGet()),opp=ON.players.find(p=>p.id!==pidGet());ON.me=me;ON.opp=opp;
  if(!me){showLobby();$('#joinBox').hidden=true;lmsg('This match already has two players. Ask your friend for a new link.',true);return}
  ON.role=m.seats.indexOf(pidGet())===0?'host':'guest';ON.oppName=opp?(opp.name||'Friend'):'';
  if(opp&&opp.team&&opp.team!==TM.rival){TM.rival=opp.team;applyTeams()}
  if(m.status==='waiting'||m.status==='lobby'){ // pre-match: both players must be here and looking at the game
    if(S.mode==='online'&&S.phase!=='menu'){S.mode='bot';S.phase='menu'}
    showLobby();renderDuo(me,opp,m.status);
    if(m.status==='lobby'&&!me.ready&&!document.hidden)wsSend({type:'ready'});
    return;
  }
  const v=m.view;if(!v)return;
  $('#rivalName').textContent=(ON.oppName||'FRIEND').slice(0,7).toUpperCase();
  if(S.mode!=='online'){
    if(ON.counting)return;
    const fresh=v.k===0&&!v.res.you.length&&!v.res.opp.length&&m.status==='playing';
    $('#lobby').hidden=true;
    if(fresh)countdown(()=>startOnline(ON.view));else startOnline(v); // rejoining mid-match: straight back in
    return;
  }
  // the other player started a rematch, or we are behind a reset
  const total=v.res.you.length+v.res.opp.length;
  if(total===0&&v.k===0&&(S.phase==='over'||S.turn>0)){startOnline(v);return}
  if(m.left&&m.left!==pidGet())netNote(`${ON.oppName} left the match.`);
  else if(m.status==='playing'&&opp&&!opp.online)netNote(`${ON.oppName} lost connection. Waiting for them…`);else if(ON.retry===0)netNote('');
  vcUI();syncOnline();
}
function countdown(done){ // 3-2-1 so both players start together
  ON.counting=true;const el=$('#cd'),num=$('#cdNum');el.hidden=false;let n=3;AU.init();
  const tick=()=>{if(n===0){el.hidden=true;ON.counting=false;done();return}num.textContent=n;num.className='';void num.offsetWidth;num.className='pop';AU.tick(n===1?2:1.4);n--;setTimeout(tick,750)};tick();
}
function startOnline(v){
  S.mode='online';AU.init();ON.named=true;$('#lobby').hidden=true;
  startGame();
  // rejoining mid-match: jump to the server's position without replaying kicks
  if(v.k>0){S.res={you:v.res.you.slice(),rival:v.res.opp.slice()};S.turn=v.k;S.anim=null;renderBoard();startTurn()}
  vcUI();syncOnline();
}
function syncOnline(){
  const v=ON.view;if(!online()||!v||S.phase==='over')return;
  if(!S.anim&&v.last&&v.last.k===S.turn){
    const L2=v.last;
    launch({shooter:L2.shooter===v.you?'you':'rival',zone:L2.zone,e:L2.e,kz:L2.kz,forced:{outcome:L2.outcome,kind:L2.kind}},seeded(String(L2.seed)));
    return;
  }
  if(!S.anim&&v.k===S.turn){
    if(v.mineDone&&S.phase!=='wait'){S.phase='wait';$('#meter').hidden=true;setPrompt(youShooting()?'SHOT <span class="tag">LOCKED</span>':'DIVE <span class="tag">LOCKED</span>',`Waiting for ${ON.oppName}…`)}
    if(S.phase==='wait')$('#hint').textContent=`Waiting for ${ON.oppName}…`;
    else if(v.oppDone)$('#hint').textContent=`${ON.oppName} has locked in. Your move.`;
  }
}
function seeded(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}
  let a=h>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function sendMove(v){
  const n=(Math.random()*2147483647)|0;
  if(Array.isArray(v))wsSend({type:'action',action:{t:'shot',k:S.turn,z:v[0],e:v[1]/1000,n}});
  else wsSend({type:'action',action:{t:'dive',k:S.turn,z:v,n}});
}
function tryResolve(){syncOnline()}
function askRematch(){ON.want=true;$('#again').disabled=true;$('#again').textContent='STARTING…';wsSend({type:'reset'})}
function leaveOnline(){wsSend({type:'leave'});ON.closing=true;if(ON.ws){try{ON.ws.close()}catch(e){}ON.ws=null}ON.code='';ON.named=false;ON.counting=false;roomClear();vcStop();netNote('');$('#cd').hidden=true;try{history.replaceState(null,'',location.pathname)}catch(e){}vcUI()}
function newCode(){const abc='abcdefghjkmnpqrstuvwxyz23456789';let c='';for(let i=0;i<5;i++)c+=abc[(Math.random()*abc.length)|0];return c}
function openInvite(){
  AU.init();showLobby();$('#joinBox').hidden=true;$('#inviteBox').hidden=false;$('#duo').hidden=true;
  $('#lobbyTitle').textContent='VS FRIEND';$('#lobbyEyebrow').textContent='ONLINE 1V1';ON.role='host';
  const code=newCode();try{history.replaceState(null,'','?room='+code)}catch(e){}
  setInviteLink(code);lmsg('Connecting…');connectRoom(code);
}
function setInviteLink(code){
  const link=inviteLink(code);$('#linkOut').textContent=link;$('#codeOut').textContent=code.toUpperCase();
  const nm=myName();ON.shareText=`${nm?nm+' challenges you':'I challenge you'} to a penalty shootout ⚽ Code ${code.toUpperCase()}`;ON.link=link;

function openJoin(code){
  showLobby();$('#inviteBox').hidden=true;$('#joinBox').hidden=false;$('#duo').hidden=true;$('#joinPlay').disabled=false;
  $('#lobbyTitle').textContent='CHALLENGE!';$('#lobbyEyebrow').textContent='PENALTY SHOOTOUT 1V1';ON.role='guest';lmsg('');
  $('#joinPlay').onclick=()=>{AU.init();if(!myName()){lmsg('Type your name first.',true);$('#nick').focus();return}
    try{localStorage.setItem('ty:nick',myName())}catch(e){}$('#joinPlay').disabled=true;lmsg('Joining…');
    try{history.replaceState(null,'','?room='+code)}catch(e){}connectRoom(code)};
}
function rejoin(code){ // this tab was already in the match (page reloaded or reopened): straight back in
  showLobby();$('#inviteBox').hidden=true;$('#joinBox').hidden=true;$('#duo').hidden=true;lmsg('Reconnecting…');setInviteLink(code);connectRoom(code);

try{$('#nick').value=localStorage.getItem('ty:nick')||''}catch(e){}
let helloT=0;
$('#nick').addEventListener('input',()=>{try{localStorage.setItem('ty:nick',myName())}catch(e){}if(ON.code){setInviteLink(ON.code);clearTimeout(helloT);helloT=setTimeout(()=>wsSend({type:'hello',name:myName()||'Player',team:TM.you}),400)}});
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('[data-teamsel] .tarrow')&&ON.code)setTimeout(()=>wsSend({type:'hello',name:myName()||'Player',team:TM.you}),50)});
$('#playFriend').addEventListener('click',openInvite);

$('#shareBtn').addEventListener('click',async()=>{const url=ON.link;if(!url)return;
  if(navigator.share){try{await navigator.share({title:'Twelve Yards',text:ON.shareText,url});return}catch(e){if(e&&e.name==='AbortError')return}}

$('#copyLink').addEventListener('click',async()=>{const t=ON.link;try{await navigator.clipboard.writeText(t);lmsg('Link copied. Send it to your friend.')}catch(e){const r=document.createRange();r.selectNodeContents($('#linkOut'));const sel=getSelection();sel.removeAllRanges();sel.addRange(r);lmsg('Select the link above and copy it.')}});

/* ---------------- Voice chat: a direct audio call between the two players (WebRTC; the game server only passes the setup messages) ---------------- */
const VC={pc:null,stream:null,on:false,muted:false,making:false,ignore:false,audio:null,needTap:false,an:null,buf:null};
const vcSupported=()=>!!(window.isSecureContext&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.RTCPeerConnection);
function vcPC(){
  if(VC.pc)return VC.pc;
  const pc=new RTCPeerConnection({iceServers:[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']}]});
  pc.onicecandidate=e=>{if(e.candidate)wsSend({type:'rtc',data:{c:e.candidate}})};
  pc.onnegotiationneeded=async()=>{try{VC.making=true;await pc.setLocalDescription();wsSend({type:'rtc',data:{d:pc.localDescription}})}catch(e){console.warn('voice',e)}finally{VC.making=false}};
  pc.ontrack=e=>{const a=VC.audio||(VC.audio=document.createElement('audio'));a.autoplay=true;a.setAttribute('playsinline','');a.srcObject=e.streams[0]||new MediaStream([e.track]);
    a.play().then(()=>{VC.needTap=false}).catch(()=>{VC.needTap=true;netNote('Tap anywhere to hear your friend');});
    try{if(AU.c){const src=AU.c.createMediaStreamSource(a.srcObject);VC.an=AU.c.createAnalyser();VC.an.fftSize=512;src.connect(VC.an);VC.buf=new Uint8Array(VC.an.fftSize)}}catch(err){}
    vcUI()};
  pc.onconnectionstatechange=()=>{if(pc.connectionState==='failed'&&pc.restartIce)pc.restartIce();vcUI()};
  return VC.pc=pc;
}
async function vcSignal(data){ // "perfect negotiation": the guest gives way if both call at the same moment
  if(!data)return;if(data.bye){vcDropPeer();return}
  const pc=vcPC(),polite=ON.role==='guest';
  try{
    if(data.d){const d=data.d,collision=d.type==='offer'&&(VC.making||pc.signalingState!=='stable');VC.ignore=!polite&&collision;if(VC.ignore)return;
      await pc.setRemoteDescription(d);if(d.type==='offer'){await pc.setLocalDescription();wsSend({type:'rtc',data:{d:pc.localDescription}})}}
    else if(data.c){try{await pc.addIceCandidate(data.c)}catch(e){if(!VC.ignore)throw e}}
  }catch(e){console.warn('voice',e)}
}
function vcDropPeer(){try{VC.pc&&VC.pc.close()}catch(e){}VC.pc=null;VC.an=null;if(VC.audio)VC.audio.srcObject=null;
  if(VC.stream&&ON.opp&&ON.opp.online){const pc=vcPC();VC.stream.getTracks().forEach(t=>pc.addTrack(t,VC.stream))}vcUI()} // the friend reloaded: call again
async function vcStart(){
  if(!vcSupported()){netNote('Voice chat needs the secure (https) game link.');setTimeout(()=>netNote(''),3500);return}
  if(!ON.code||!ON.opp){netNote('Voice chat works once your friend has joined.');setTimeout(()=>netNote(''),3000);return}
  try{VC.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}})}
  catch(e){netNote('Microphone blocked. Allow it in your browser settings.');setTimeout(()=>netNote(''),4000);return}
  const pc=vcPC();VC.stream.getTracks().forEach(t=>pc.addTrack(t,VC.stream));VC.on=true;VC.muted=false;
  if(VC.audio)VC.audio.play().catch(()=>{});vcUI();
}
function vcToggle(){AU.init();if(!VC.on){vcStart();return}VC.muted=!VC.muted;VC.stream.getAudioTracks().forEach(t=>t.enabled=!VC.muted);vcUI()}
function vcStop(){if(VC.pc)wsSend({type:'rtc',data:{bye:1}});if(VC.stream)VC.stream.getTracks().forEach(t=>t.stop());VC.stream=null;VC.on=false;VC.muted=false;try{VC.pc&&VC.pc.close()}catch(e){}VC.pc=null;VC.an=null;if(VC.audio)VC.audio.srcObject=null}
function vcUI(){
  const inRoom=!!ON.code,cls=VC.on?(VC.muted?'muted':'on'):'';
  const hud=$('#vcHud');hud.hidden=!(inRoom&&online());hud.className='icon-btn vc '+cls;hud.setAttribute('aria-label',!VC.on?'Start voice chat':VC.muted?'Unmute microphone':'Mute microphone');
  const b=$('#vcBtn');b.hidden=!(inRoom&&ON.opp);b.className='btn alt wide '+cls;$('#vcBtnTxt').textContent=!VC.on?'VOICE CHAT':VC.muted?'MIC MUTED':'VOICE ON · TAP TO MUTE';
}
function vcLevel(){ // light up the mic button and the friend's card while they talk
  if(!VC.an)return;VC.an.getByteTimeDomainData(VC.buf);let m=0;for(let i=0;i<VC.buf.length;i+=8)m=Math.max(m,Math.abs(VC.buf[i]-128));
  const talk=m>14;$('#vcHud').classList.toggle('talking',talk);const th=$('#pThem');th&&th.parentElement.classList.toggle('talking',talk);
}
setInterval(vcLevel,120);
$('#vcHud').addEventListener('click',vcToggle);$('#vcBtn').addEventListener('click',vcToggle);
document.addEventListener('pointerdown',()=>{if(VC.needTap&&VC.audio){VC.audio.play().then(()=>{VC.needTap=false;netNote('')}).catch(()=>{})}},{capture:true});

// opened from an invite link
{const code=(qs.get('room')||'').toLowerCase();if(/^[a-z0-9]{4,12}$/.test(code)){
  if(roomSaved()===code)rejoin(code); // this tab already belongs to that match
  else openJoin(code);
}}

resize();renderBoard();requestAnimationFrame(loop);
if(document.readyState==='complete')initPixi();else addEventListener('load',initPixi);
window.TY={S,PX,ON,TM,AU,kitPose,IMG,VC}; // handy for debugging from the browser console
})();
